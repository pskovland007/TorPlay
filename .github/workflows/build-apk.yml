name: Build TorPlay APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract app version
        id: meta
        run: |
          APP_VER=$(grep -E 'versionName[[:space:]]*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$APP_VER" ]; then
            APP_VER="1.0.1"
          fi
          echo "version=$APP_VER" >> "$GITHUB_OUTPUT"
          echo "Detected TorPlay version: $APP_VER"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK artifact
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk "release-output/TorPlay-v${{ steps.meta.outputs.version }}.apk"

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TorPlay-APK
          path: release-output/TorPlay-v${{ steps.meta.outputs.version }}.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}-build-{1}', steps.meta.outputs.version, github.run_number) }}
          name: TorPlay v${{ steps.meta.outputs.version }} (Build #${{ github.run_number }})
          body: |
            Автоматическая сборка **TorPlay v${{ steps.meta.outputs.version }}** для Android TV и планшетов.
            В этом обновлении: автоподстановка версии в имя APK и релизы GitHub, объединённый блок обновлений в настройках, надёжная автопроверка обновлений с резервным каналом и умный фоновый запуск TorrServe с автовозвратом в TorPlay.
          files: release-output/TorPlay-v${{ steps.meta.outputs.version }}.apk
          make_latest: true
