name: Build TorPlay APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK artifact
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/TorPlay-v0.1.0-stage1.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TorPlay-APK
          path: release-output/TorPlay-v0.1.0-stage1.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('stage1-build-{0}', github.run_number) }}
          name: TorPlay Stage 1 (Build #${{ github.run_number }})
          body: |
            Автоматическая сборка **TorPlay** (Этап 1) для Android TV (Xiaomi Mi Box, Android 9+).
            Скачайте файл `TorPlay-v0.1.0-stage1.apk` ниже и установите на приставку.
          files: release-output/TorPlay-v0.1.0-stage1.apk
          make_latest: true
